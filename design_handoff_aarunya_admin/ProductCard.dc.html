<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-card="" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="display:flex;flex-direction:column;gap:14px;min-width:0;height:100%;box-sizing:border-box;padding:10px 10px 12px;background:#FFFFFF;border:1px solid {{ fx.border }};box-shadow:{{ fx.shadow }};transform:{{ fx.lift }};font-family:'Jost',sans-serif;color:#302722;transition:transform .6s cubic-bezier(.16,1,.3,1),box-shadow .6s cubic-bezier(.16,1,.3,1),border-color .4s ease">
  <div data-card-img="" style="position:relative;aspect-ratio:{{ ratio }};overflow:hidden;background:{{ tint }}">
    <a href="{{ p.href }}" aria-label="View {{ p.name }}" style="display:block;width:100%;height:100%">
      <sc-if value="{{ hasImg }}" hint-placeholder-val="{{ false }}">
        <div style="position:relative;width:100%;height:100%;transform:{{ fx.zoom }};transition:transform 1.2s cubic-bezier(.16,1,.3,1)">{{ imgEl }}{{ imgEl2 }}</div>
      </sc-if>
      <sc-if value="{{ noImg }}" hint-placeholder-val="{{ true }}">
        <div role="img" aria-label="{{ alt }}" style="width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;padding:12px;box-sizing:border-box;background:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 8px,rgba(255,255,255,0) 8px 16px);transform:{{ fx.zoom }};transition:transform 1.2s cubic-bezier(.16,1,.3,1)">
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#756964;background:rgba(255,249,246,.88);padding:3px 8px;white-space:nowrap">{{ ph }}</span>
        </div>
      </sc-if>
    </a>
    <sc-if value="{{ shine }}" hint-placeholder-val="{{ false }}">
      <span data-shine="" aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,0) 32%,rgba(255,238,200,.55) 45%,rgba(255,255,255,.95) 50%,rgba(255,238,200,.55) 55%,rgba(255,255,255,0) 68%);mix-blend-mode:soft-light;transform:translateX(-110%)"></span>
    </sc-if>
    <span aria-hidden="true" style="position:absolute;inset:8px;border:1px solid rgba(255,249,240,.85);opacity:{{ fx.frame }};transform:{{ fx.frameScale }};pointer-events:none;transition:opacity .5s ease,transform .7s cubic-bezier(.16,1,.3,1)"></span>
    <div style="position:absolute;top:10px;left:10px;display:flex;gap:6px;pointer-events:none">
      <sc-if value="{{ p.hasOff }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:10.5px;font-weight:500;letter-spacing:.06em;padding:5px 9px;background:rgba(255,249,246,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#8D3545">{{ p.off }}</span>
      </sc-if>
      <sc-if value="{{ p.isNew }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;background:rgba(48,39,34,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#FFF9F6">New</span>
      </sc-if>
    </div>
    <button type="button" aria-label="{{ wishLabel }}" aria-pressed="{{ wishPressed }}" onClick="{{ wish }}" style="position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,249,246,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .2s" style-hover="transform:scale(1.08)">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" style="fill:{{ heart }};stroke:{{ heartStroke }};stroke-width:1.5;stroke-linejoin:round"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"></path></svg>
    </button>
    <sc-if value="{{ soldOut }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;left:10px;bottom:10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;background:rgba(48,39,34,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#FFF9F6">Sold out</span>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;padding:0 2px;flex:1;min-width:0">
    <div style="display:flex;align-items:center;gap:8px;min-height:16px">
      <div role="group" aria-label="Colours" style="display:flex;align-items:center;gap:6px">
        <sc-for list="{{ swatches }}" as="sw" hint-placeholder-count="2">
          <button type="button" title="{{ sw.label }}" aria-label="{{ sw.aria }}" aria-pressed="{{ sw.pressed }}" onClick="{{ sw.pick }}" style="width:13px;height:13px;border-radius:50%;border:none;padding:0;cursor:pointer;background:{{ sw.hex }};box-shadow:{{ sw.ring }};transition:box-shadow .2s"></button>
        </sc-for>
      </div>
      <span style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#756964">{{ colorText }}</span>
    </div>
    <a href="{{ p.href }}" style="color:{{ fx.nameColor }};text-decoration:none;font-family:'Jost',sans-serif;font-weight:400;font-size:clamp(14px,1.15vw,15.5px);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:.01em;transition:color .35s ease">{{ p.name }}</a>
    <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px">
      <span style="font-size:15px;font-weight:500;letter-spacing:.02em;color:#302722">{{ p.price }}</span>
      <sc-if value="{{ p.hasMrp }}" hint-placeholder-val="{{ false }}">
        <s style="font-size:12.5px;color:#756964">{{ p.mrp }}</s>
      </sc-if>
    </div>
  </div>
  <button type="button" onClick="{{ add }}" disabled="{{ soldOut }}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:0;border:1px solid #E7D3AE;background:linear-gradient(135deg,#FBF3E4 0%,#F3E2C0 55%,#EBD3A3 100%);color:#5E4416;font-family:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:{{ addOpacity }};transition:background .3s,border-color .3s,color .3s,letter-spacing .4s cubic-bezier(.16,1,.3,1)" style-hover="background:#8D3545;border-color:#8D3545;color:#FFF9F6;letter-spacing:.18em">
    <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"><path d="M5.5 8h13l-1 12.5h-11z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
    {{ addLabel }}
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:460},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = { vi: 0, h: false };
  componentDidUpdate(pp) {
    if (pp.p && this.props.p && pp.p.id !== this.props.p.id && this.state.vi) this.setState({ vi: 0 });
  }
  renderVals() {
    const p = this.props.p || { name: '', variants: [] };
    const vs = p.variants || [];
    let vi = Math.min(this.state.vi, Math.max(vs.length - 1, 0));
    const v = vs[vi] || {};
    const img = (v.images || [])[0], img2 = (v.images || [])[1];
    const h = this.state.h, I = { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block' };
    const sold = v.stock === 0;
    return {
      p, ratio: p.ratio || '4 / 5', tint: v.tint || '#FBEFEF',
      hasImg: !!img, noImg: !img, shine: !!p.motion,
      imgEl: img ? React.createElement('img', { key: 'a', src: img, alt: `${p.name} in ${v.label || ''}`, loading: 'lazy', decoding: 'async', style: I }) : null,
      imgEl2: img2 ? React.createElement('img', { key: 'b', src: img2, alt: '', 'aria-hidden': true, loading: 'lazy', decoding: 'async', style: { ...I, opacity: h ? 1 : 0, transition: 'opacity .7s cubic-bezier(.4,0,.2,1)' } }) : null,
      fx: {
        border: h ? '#C79A45' : 'rgba(199,154,69,.32)',
        shadow: h ? '0 22px 44px -26px rgba(141,53,69,.35)' : '0 0 0 rgba(141,53,69,0)',
        lift: h ? 'translate3d(0,-4px,0)' : 'translate3d(0,0,0)',
        zoom: h ? 'scale(1.06)' : 'scale(1)',
        frame: h ? 1 : 0, frameScale: h ? 'scale(1)' : 'scale(1.04)',
        nameColor: h ? '#8D3545' : '#302722',
      },
      enter: (e) => { this.setState({ h: true }); const sh = p.motion && e && e.currentTarget && e.currentTarget.querySelector('[data-shine]'); if (sh && sh.animate && !(this.sh && this.sh.playState === 'running')) this.sh = sh.animate([{ transform: 'translateX(-110%)' }, { transform: 'translateX(110%)' }], { duration: 1150, easing: 'cubic-bezier(.45,0,.25,1)' }); },
      leave: () => this.setState({ h: false }),
      ph: `${p.phType || 'jewellery'} · ${(v.label || '').toLowerCase()}`,
      alt: `${p.name} in ${v.label || ''}`,
      soldOut: sold, addLabel: sold ? 'Sold out' : 'Add to Cart', addOpacity: sold ? 0.5 : 1,
      swatches: vs.map((s, i) => ({
        ...s,
        ring: i === vi ? '0 0 0 2px #FFF9F6, 0 0 0 3px #9D762F' : 'inset 0 0 0 1px rgba(48,39,34,.18)',
        pressed: i === vi ? 'true' : 'false',
        aria: `${s.label}${s.stock === 0 ? ' (sold out)' : ''}`,
        pick: () => this.setState({ vi: i }),
      })),
      colorText: vs.length > 1 ? `${vs.length} colours` : (v.label || ''),
      heart: p.wished ? '#8D3545' : 'none', heartStroke: p.wished ? '#8D3545' : '#302722',
      wishLabel: p.wished ? `Remove ${p.name} from wishlist` : `Add ${p.name} to wishlist`,
      wishPressed: p.wished ? 'true' : 'false',
      wish: (e) => { e && e.preventDefault(); p.onWish && p.onWish(p.id, e && e.currentTarget); },
      add: (e) => { if (!sold && p.onAdd) p.onAdd(p.id, v.id, e && e.currentTarget); },
    };
  }
}
</script>
</body>
</html>
